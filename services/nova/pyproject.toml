[project]
name = "nova"
version = "0.1.0"
description = "Nova, the AI host of Unseen: a LiveKit agent."
requires-python = ">=3.14,<3.15"
dependencies = [
    # LiveKit agents, with silero for voice activity detection (silence in free talk).
    "livekit-agents[anthropic,openai,silero]~=1.8.6",
    # Nova's line writer calls these SDKs directly (both come with the LiveKit extras):
    # openai for Ollama's OpenAI-compatible API (local Gemma), anthropic for Claude.
    "anthropic~=0.125",
    "openai~=2.54",
    "python-dotenv~=1.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.17",
]

[tool.uv]
# An application, not a library: nothing to build or publish.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
