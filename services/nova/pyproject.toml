[project]
name = "nova"
version = "0.1.0"
description = "Nova, the AI host of Unseen: a LiveKit agent."
requires-python = ">=3.14,<3.15"
dependencies = [
    # openai: Ollama's OpenAI-compatible API (local Gemma). anthropic: Claude, when
    # NOVA_LLM selects it. silero: voice activity detection for silence in free talk.
    "livekit-agents[anthropic,openai,silero]~=1.8.6",
    "python-dotenv~=1.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.17",
]

[tool.uv]
# An application, not a library: nothing to build or publish.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
