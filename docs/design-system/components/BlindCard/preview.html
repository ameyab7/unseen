<div class="ub">
<style>
.ub{background:var(--velvet);padding:var(--space-l);font-family:var(--font-text)}
.ub .c{max-width:350px;background:var(--plush);border-radius:var(--radius-l);padding:var(--space-m);display:flex;flex-direction:column;gap:var(--space-m);color:var(--pearl)}
.ub .t{display:flex;align-items:center;gap:var(--space-s)}
.ub .av{width:56px;height:56px;border-radius:50%;background:var(--plush-raised);display:flex;align-items:center;justify-content:center;font:italic 500 22px var(--font-display);color:var(--mist);flex:none}
.ub .nm{margin:0;font:italic 500 24px/30px var(--font-display)}

.ub .w span{width:3px;border-radius:2px;background:var(--mist)}
.ub .q{display:flex;flex-direction:column;gap:2px}
.ub .a{margin:0;font:400 17px/24px var(--font-text)}

</div>
