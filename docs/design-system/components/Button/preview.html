<div class="ux">
<style>
.ux{background:var(--velvet);padding:var(--space-l);display:flex;flex-wrap:wrap;gap:var(--space-s);align-items:center;font-family:var(--font-text)}
.ux button{min-height:52px;padding:0 var(--space-l);border-radius:var(--radius-pill);font:600 17px/22px var(--font-text);cursor:pointer;border:1.5px solid transparent;background:none}
.ux .p{background:var(--lamplight);color:var(--lamplight-ink)}
.ux .s{color:var(--pearl);border-color:var(--seam-strong)}
.ux .q{color:var(--lamplight-text);padding:0 var(--space-s)}
.ux .d{color:var(--danger);border-color:var(--danger);display:inline-flex;align-items:center;gap:var(--space-xs)}
.ux button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
<button class="p">Listen in</button>
<button class="s">Not tonight</button>
<button class="q">How the show works</button>
<button class="d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>Report</button>
</div>
<script>void 0;</script>
