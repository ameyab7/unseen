<!-- @dsCard group="Show" height=320 subtitle="Requested and confirmed" -->
<div class="us">
<style>
.us{background:var(--velvet);padding:var(--space-l);display:flex;flex-direction:column;gap:var(--space-m);font-family:var(--font-text);max-width:390px}
.us .t{background:var(--plush);border-radius:var(--radius-l);padding:18px 26px;display:flex;flex-direction:column;gap:6px;color:var(--pearl);-webkit-mask:radial-gradient(circle at 0 50%,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 12px,#000 12.5px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 12px,#000 12.5px) right/51% 100% no-repeat}
.us .m{margin:0;font:400 13px/18px var(--font-text);color:var(--mist)}
.us .h{margin:0;font:600 17px/22px var(--font-text)}
.us .ok{margin:0;display:flex;align-items:center;gap:6px;font:400 13px/18px var(--font-text);color:var(--success)}
.us svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<article class="t" aria-label="Seat requested"><p class="m">Seat requested</p><p class="h">Thursday or Friday</p><p class="m">We'll cast by Wednesday and ask you to confirm on the day.</p></article>
<article class="t" aria-label="Seat confirmed"><p class="m">Your seat</p><p class="h">Thursday, 9:26 pm</p><p class="ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Confirmed. Backstage opens at 9:16.</p></article>
</div>
<script>void 0;</script>
