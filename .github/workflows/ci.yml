name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Typecheck, lint and tests only. pgTAP joins once supabase/ exists; a Maestro smoke
# test joins once the first real screens do. Nothing here talks to staging or production.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Fails if a .env file is committed or an .env.example holds a value.
      - run: pnpm check:env
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Includes the tokens drift check: tokens.ts must match tokens.json.
      - run: pnpm test

  # Nova, the AI host (Python). Tests never call LiveKit, Ollama or Claude.
  nova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/nova
    steps:
      - uses: actions/checkout@v7

      # Installs uv; uv then installs the Python version in .python-version.
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: services/nova/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
